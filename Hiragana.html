<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>J-Letters</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

<div class="quiz-container" style="position: relative;">
        
<!-- NÚT MỞ BẢNG CHỮ CÁI GÓC TRÊN BÊN PHẢI (Không ảnh hưởng đến chữ ở giữa) -->
        <button onclick="openTableModal()" style="position: absolute; top: 15px; right: 15px; background: #3498db; border: none; color: white; padding: 6px 12px; border-radius: 6px; cursor: pointer; font-size: 14px;" title="Xem bảng chữ cái">
            📋
        </button>

        <h2>Hiragana</h2>

        <div id="streakDisplay" style="font-size: 1.5rem; font-weight: bold; text-align: center; color: #ff9800; margin-bottom: 15px;">🔥 Streak: 0</div>

        
        <!-- Khu vực hiển thị "hình ảnh" của chữ cái (to, rõ) -->
        <div id="characterDisplay" class="char-box">
            あ
        </div>

        <!-- Các lựa chọn nghĩa (Đáp án) -->
        <div class="options-container">
            <button class="option-btn" onclick="checkAnswer(0)">Đang tải...</button>
            <button class="option-btn" onclick="checkAnswer(1)">Đang tải...</button>
            <button class="option-btn" onclick="checkAnswer(2)">Đang tải...</button>
            <button class="option-btn" onclick="checkAnswer(3)">Đang tải...</button>
        </div>

        <!-- Thông báo đúng/sai và nút qua câu tiếp theo -->
        <p id="resultMessage"></p>
        <button id="nextBtn" style="display: none;" onclick="nextQuestion()">Câu tiếp theo</button>

        <!-- NÚT "CHƯA HỌC" Ở GÓC DƯỚI BÊN PHẢI -->
        <div class="footer-action">
            <button id="skipBtn" onclick="nextQuestion()">Chưa học</button>
        </div>

        <!-- Liên kết quay về trang chủ -->
        <div style="margin-top: 15px; font-size: 14px; text-align: center;">
            <a href="index.html">⬅ Quay về trang chủ</a>
        </div>
    </div>


    <!-- Khung Modal hiển thị bảng chữ cái -->
<div id="tableModal" style="display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.7); z-index: 1000; justify-content: center; align-items: center;">
    <div style="background: white; padding: 20px; border-radius: 10px; max-width: 90%; max-height: 90%; text-align: center; position: relative;">
        <!-- Nút đóng cửa sổ -->
        <button onclick="closeTableModal()" style="position: absolute; top: 10px; right: 10px; background: #e74c3c; color: white; border: none; padding: 5px 10px; border-radius: 50%; cursor: pointer; font-weight: bold;">✕</button>
        
        <h3 style="margin-top: 0; color: #333;">Bảng Chữ Cái Hiragana</h3>
        
        <!-- Đường dẫn tới ảnh bảng chữ cái của bạn (Thay chữ 'duong-dan-anh.jpg' bằng tên file ảnh của bạn) -->
        <img src="hiraganatable.png" alt="Bảng chữ cái Hiragana" style="max-width: 100%; max-height: 70vh; border-radius: 5px; margin-top: 10px;">
    </div>
</div>
    

    <script src="script.js"></script>
</body>
</html>
