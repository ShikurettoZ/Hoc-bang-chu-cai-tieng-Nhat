<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>J-Letters</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <div class="quiz-container">
        <h2>Hiragana</h2>
        <div id="streakDisplay" style="font-size: 1.5rem; font-weight: bold; text-align: center; color: #ff9800; margin-bottom: 15px;">🔥 Streak: 0</div>

        
        <!-- Khu vực hiển thị "hình ảnh" của chữ cái (to, rõ) -->
        <div id="characterDisplay" class="char-box">
            あ
        </div>

        <!-- Các lựa chọn nghĩa (Đáp án) -->
        <div class="options-container">
            <button class="option-btn" onclick="checkAnswer(0)">Đang tải...</button>
            <button class="option-btn" onclick="checkAnswer(1)">Đang tải...</button>
            <button class="option-btn" onclick="checkAnswer(2)">Đang tải...</button>
            <button class="option-btn" onclick="checkAnswer(3)">Đang tải...</button>
        </div>

        <!-- Thông báo đúng/sai và nút qua câu tiếp theo -->
        <p id="resultMessage"></p>
        <button id="nextBtn" style="display: none;" onclick="nextQuestion()">Câu tiếp theo</button>

        <!-- NÚT "CHƯA HỌC" Ở GÓC DƯỚI BÊN PHẢI -->
        <div class="footer-action">
            <button id="skipBtn" onclick="nextQuestion()">Chưa học</button>
        </div>

        <!-- Liên kết quay về trang chủ -->
        <div style="margin-top: 15px; font-size: 14px; text-align: center;">
            <a href="index.html">⬅ Quay về trang chủ</a>
        </div>
    </div>
    

    <script src="script.js"></script>
</body>
</html>
