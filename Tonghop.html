<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tổng Hợp Chữ Tiếng Nhật</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <div class="quiz-container">
        <h2>Tổng Hợp Chữ Tiếng Nhật</h2>
        
        <div id="characterDisplay" class="char-box">あ</div>

        <div class="options-container">
            <button class="option-btn" onclick="checkAnswer(0)">Đang tải...</button>
            <button class="option-btn" onclick="checkAnswer(1)">Đang tải...</button>
            <button class="option-btn" onclick="checkAnswer(2)">Đang tải...</button>
            <button class="option-btn" onclick="checkAnswer(3)">Đang tải...</button>
        </div>

        <p id="resultMessage"></p>
        <button id="nextBtn" style="display: none;" onclick="nextQuestion()">Câu tiếp theo</button>

        <div class="footer-action">
            <button id="skipBtn" onclick="nextQuestion()">Chưa học</button>
        </div>
        
        <div style="margin-top: 15px; font-size: 14px; text-align: center;">
            <a href="index.html">⬅ Quay về trang chủ</a>
        </div>
    </div>

    <script>
        // Danh sách tổng hợp (Bạn có thể thêm cả Katakana và Kanji vào đây sau)
        const quizData = [
            // Mẫu Hiragana
            { char: "あ", meaning: "A (Hiragana)" },
            { char: "い", meaning: "I (Hiragana)" },
            { char: "う", meaning: "U (Hiragana)" },
            { char: "え", meaning: "E (Hiragana)" },
            { char: "お", meaning: "O (Hiragana)" },
            
            // Mẫu Katakana (Ví dụ thêm vào để test tổng hợp)
            { char: "ア", meaning: "A (Katakana)" },
            { char: "イ", meaning: "I (Katakana)" },
            { char: "ウ", meaning: "U (Katakana)" }
        ];

        let currentQuiz = null;
        const charDisplay = document.getElementById('characterDisplay');
        const optionButtons = document.querySelectorAll('.option-btn');
        const resultMessage = document.getElementById('resultMessage');
        const nextBtn = document.getElementById('nextBtn');

        function loadQuiz() {
            resultMessage.textContent = "";
            nextBtn.style.display = "none";
            optionButtons.forEach(btn => {
                btn.classList.remove('correct', 'wrong');
                btn.disabled = false;
            });

            const randomIndex = Math.floor(Math.random() * quizData.length);
            currentQuiz = quizData[randomIndex];
            charDisplay.textContent = currentQuiz.char;

            let options = [currentQuiz.meaning];
            while (options.length < 4) {
                let randomQuiz = quizData[Math.floor(Math.random() * quizData.length)];
                if (!options.includes(randomQuiz.meaning)) {
                    options.push(randomQuiz.meaning);
                }
            }
            
            options.sort(() => Math.random() - 0.5);

            optionButtons.forEach((btn, index) => {
                btn.textContent = options[index];
            });
        }

        function checkAnswer(selectedIndex) {
            const selectedBtn = optionButtons[selectedIndex];
            optionButtons.forEach(btn => btn.disabled = true);

            if (selectedBtn.textContent === currentQuiz.meaning) {
                selectedBtn.classList.add('correct');
                resultMessage.textContent = "Corect! 🎉";
                resultMessage.style.color = "#2ecc71";
            } else {
                selectedBtn.classList.add('wrong');
                resultMessage.textContent = "Incorrect! 😢";
                resultMessage.style.color = "#e74c3c";
                
                optionButtons.forEach(btn => {
                    if (btn.textContent === currentQuiz.meaning) {
                        btn.classList.add('correct');
                    }
                });
            }

            nextBtn.style.display = "block";
        }

        function nextQuestion() {
            loadQuiz();
        }

        loadQuiz();
    </script>
</body>
</html>
